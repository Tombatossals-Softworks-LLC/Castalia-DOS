# =====================================================================
#  tools/dosbox-x.conf  -  DOSBox-X profile for CASTALIA DOS development
# ---------------------------------------------------------------------
#  Fast-iteration profile for testing the Castalia tools and boot files.
#  DOSBox-X is for quick turnaround; use 86Box/PCem for accurate 386SX
#  timing and hardware behaviour (see tools/86box/README.md and
#  docs/TESTING.md).
#
#  Run:
#     dosbox-x -conf tools/dosbox-x.conf
#  To boot a built floppy image instead of the mounted tree, uncomment
#  the "boot" line in [autoexec] below and point it at your image.
# =====================================================================

[sdl]
output=opengl
autolock=true

[dosbox]
title=CASTALIA DOS (DOSBox-X)
# svga_s3 gives a standard VGA the Castalia UI expects.
machine=svga_s3
# 4 MB matches the primary 386SX target.
memsize=4

[cpu]
# A 386 core with a modest fixed cycle count approximates a slow 386.
# This is NOT cycle-accurate - use 86Box for real 386SX timing.
core=normal
cputype=386
cycles=fixed 3000

[dos]
# Present MS-DOS 6.22-compatible behaviour, matching Castalia's story.
ver=6.22
xms=true
ems=true
umb=true

[render]
scaler=normal2x

[speaker]
pcspeaker=true

[sblaster]
sbtype=sbpro2
sbbase=220
irq=5
dma=1

[autoexec]
# --- Option A: run the tools from the source tree (fast edit/build) ---
# Mount the repo root as C: and run a Castalia tool directly.  Adjust the
# path to wherever you checked out the repository on your host.
mount c .
c:
# Example: run the built launcher (after 'wmake'):
#   cd build
#   launch.exe
echo CASTALIA DOS DOSBox-X profile ready.
echo Mounted the repo as C:.  Run build\launch.exe after wmake.

# --- Option B: boot a built floppy image (full boot menu) -------------
# Comment out Option A above and uncomment the next line, pointing it at
# your image, to exercise the real CONFIG.SYS boot menu:
#   boot dist/castalia-dos-0.2-peniscola-boot.img
