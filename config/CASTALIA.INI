; =====================================================================
;  CASTALIA.INI  -  master settings for CASTALIA DOS tools
;  Installed to C:\CASTALIA\CFG\CASTALIA.INI
;  Read by CASTALIA.EXE (menu) and other Castalia tools.
;  Plain INI: [section] then key=value.  ';' starts a comment.
; =====================================================================

[about]
product  = CASTALIA DOS
edition  = 386SX Edition
version  = 1.0
codename = Tombatossals
build    = 2026-07
project  = The Castalia DOS Project

[paths]
root    = C:\CASTALIA
bin     = C:\CASTALIA\BIN
drv     = C:\CASTALIA\DRV
cfg     = C:\CASTALIA\CFG
help    = C:\CASTALIA\HELP
games   = C:\GAMES
backup  = C:\CASTALIA\BACKUP

[ui]
; VGA text attributes are fg + bg*16.  These are advisory defaults; the
; tools also carry compiled-in fallbacks so a missing INI is harmless.
desktop_fg = 7      ; light grey
desktop_bg = 1      ; blue
title_fg   = 14     ; amber
accent_fg  = 14     ; amber
select_fg  = 0      ; black on amber bar
select_bg  = 14
mouse      = optional

[menu]
; Whether AUTOEXEC.BAT should start the menu automatically (per profile
; this is also controlled by the boot choice).
autostart  = yes
show_logo  = yes
confirm_exit = no

[launcher]
; Defaults applied to games that do not specify these keys.
default_profile = XMS
default_sound   = SBPRO
games_file      = C:\CASTALIA\CFG\GAMES.INI

[sound]
; Last sound profile chosen in SETSOUND.EXE (it also writes SOUND.BAT).
profile = SBPRO
blaster = A220 I5 D1 H5 T4

[net]
; The network, for the online game catalogue (CATALOG.EXE).  Nothing
; here is loaded at boot: the catalogue loads the packet driver below
; when it opens and unloads it when it closes, so games keep every byte.
; A driver already loaded by AUTOEXEC.BAT is used and left alone.
;
; driver: the packet driver for your card and its settings.  Programs
; without a path are taken from C:\CASTALIA\NET.  Leave it empty until
; you have a card; the catalogue says what to set.  Examples:
;   NE2000 or clone at port 300h, IRQ 10 ..  NE2000.COM 0x60 10 0x300
;   3Com EtherLink III (3C509) ............  3C509.COM 0x60
;   SLIP on COM1, 19200 baud ..............  ETHERSL.COM 0x60 4 0x3F8 19200
;   PLIP cable on LPT1 ....................  PLIP.COM 0x60 7 0x378
; packet_int: the software interrupt the driver answers on (0x60-0x80).
; dhcp: yes to ask the network for an address; no to use the IPADDR,
; NETMASK, GATEWAY and NAMESERVER lines in C:\CASTALIA\NET\MTCP.CFG.
driver     =
packet_int = 0x60
dhcp       = yes

[catalog]
; Where the list of games comes from.  Plain http:// only: a 386 cannot
; speak TLS, so an https:// address can never be fetched.
url        = http://dos.castaliaos.com/catalog/CATALOG.TXT
