; =====================================================================
;  CASTALIA.INI  -  master settings for CASTALIA DOS tools
;  Installed to C:\CASTALIA\CFG\CASTALIA.INI
;  Read by CASTALIA.EXE (menu) and other Castalia tools.
;  Plain INI: [section] then key=value.  ';' starts a comment.
; =====================================================================

[about]
product  = CASTALIA DOS
edition  = 386SX Edition
version  = 1.0
codename = Tombatossals
build    = 2026-07
project  = The Castalia DOS Project

[paths]
root    = C:\CASTALIA
bin     = C:\CASTALIA\BIN
drv     = C:\CASTALIA\DRV
cfg     = C:\CASTALIA\CFG
help    = C:\CASTALIA\HELP
games   = C:\GAMES
backup  = C:\CASTALIA\BACKUP

[ui]
; VGA text attributes are fg + bg*16.  These are advisory defaults; the
; tools also carry compiled-in fallbacks so a missing INI is harmless.
desktop_fg = 7      ; light grey
desktop_bg = 1      ; blue
title_fg   = 14     ; amber
accent_fg  = 14     ; amber
select_fg  = 0      ; black on amber bar
select_bg  = 14
mouse      = optional

[menu]
; Whether AUTOEXEC.BAT should start the menu automatically (per profile
; this is also controlled by the boot choice).
autostart  = yes
show_logo  = yes
confirm_exit = no

[launcher]
; Defaults applied to games that do not specify these keys.
default_profile = XMS
default_sound   = SBPRO
games_file      = C:\CASTALIA\CFG\GAMES.INI

[sound]
; Last sound profile chosen in SETSOUND.EXE (it also writes SOUND.BAT).
profile = SBPRO
blaster = A220 I5 D1 H5 T4
