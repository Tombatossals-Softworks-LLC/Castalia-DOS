; =====================================================================
;  PROFILES.INI  -  memory-profile catalogue for CASTALIA DOS
;  Installed to C:\CASTALIA\CFG\PROFILES.INI
;
;  This file DOCUMENTS the boot profiles defined in CONFIG.SYS.  It is
;  read by MEMPROF.EXE and the Castalia menu to describe each profile to
;  the user.  Editing it does NOT change CONFIG.SYS; it only changes the
;  descriptions shown in the tools.
;
;  'menu' is the CONFIG.SYS boot-menu entry number, which is exactly what
;  the kernel exports as %CONFIG% - this kernel's menu has numbered
;  entries, not named blocks (see docs/BOOT.md).  'config' is the readable
;  name AUTOEXEC.BAT derives from that digit and puts in %CASTPROFILE%.
;
;  'conv_kb' is the APPROXIMATE free conventional memory to expect on a
;  typical 386SX with 4 MB RAM.  Real numbers vary with chipset UMB space.
; =====================================================================

[CLEAN]
menu     = 1
config   = CLEAN
name     = Maximum Compatibility
conv_kb  = 615
himem    = yes
ems      = no
umb      = no
mouse    = no
summary  = HIMEMX + DOS in the HMA only.  No EMM386, no UMBs, no TSRs.
advantage= Highest compatibility for cranky real-mode games.
drawback = No expanded memory; drivers cannot load high.
games    = Prince of Persia, Commander Keen, Monkey Island, SimCity
notes    = Try this first when a game refuses to start elsewhere.

[XMS]
menu     = 2
config   = XMS
name     = XMS Gaming
conv_kb  = 628
himem    = yes
ems      = no
umb      = yes
mouse    = yes
summary  = HIMEMX + JEMM386 NOEMS + UMBs.  No EMS page frame, so this
           gives the most free conventional memory with XMS available.
advantage= Best all-round profile; drivers load high.
drawback = No expanded (EMS) memory for the few games that need it.
games    = Doom, Wolfenstein 3D, Dune II, Stunts, Lemmings, X-COM
notes    = The default boot profile.

[EMS]
menu     = 3
config   = EMS
name     = EMS Gaming
conv_kb  = 600
himem    = yes
ems      = yes
umb      = yes
mouse    = yes
summary  = HIMEMX + JEMM386 with a 64 KB EMS page frame + UMBs.
advantage= Provides expanded memory for EMS-aware titles.
drawback = The page frame costs upper memory; slightly less conventional.
games    = Ultima VI/VII setup, some Sierra titles, Warcraft
notes    = Use only when a game specifically asks for EMS.

[CDROM]
menu     = 4
config   = CDROM
name     = CD-ROM Gaming
conv_kb  = 585
himem    = yes
ems      = yes
umb      = yes
mouse    = yes
cdrom    = yes
summary  = EMS base + UIDE.SYS (IDE/ATAPI CD) + SHSUCDX, loaded high.
advantage= CD-ROM games work; sound environment is set.
drawback = CD driver + MSCDEX use memory even loaded high.
games    = The 7th Guest, CD talkie versions of adventures
notes    = The CD appears as drive D: by default.

[WIN3X]
menu     = 5
config   = WIN3X
name     = Windows 3.x Mode
conv_kb  = 590
himem    = yes
ems      = yes
umb      = yes
mouse    = yes
smartdrv = yes
summary  = HIMEMX + JEMM386 (EMS) + UMBs + mouse + disk cache.
advantage= Comfortable base for Windows 3.1 and WfW 3.11.
drawback = Enhanced mode needs a 386DX or better; heavy on a 386SX.
games    = Windows 3.1 itself; light Windows software
notes    = Type WIN to start Windows, or use the Castalia menu.

[DIAG]
menu     = 6
config   = DIAG
name     = Diagnostics
conv_kb  = 615
himem    = yes
ems      = no
umb      = no
mouse    = no
summary  = The CLEAN base, but AUTOEXEC.BAT runs HWINFO.EXE and stops at
           the command prompt instead of opening the Castalia menu.
advantage= Inspect the machine without disturbing a game profile.
drawback = No UMBs, no CD, no mouse - it is not meant for playing.
games    = (none - inspection use)
notes    = Run HWINFO again any time; CASTID prints the kernel identity.

[SAFE]
menu     = 7
config   = SAFE
name     = Safe Mode
conv_kb  = 635
himem    = no
ems      = no
umb      = no
mouse    = no
summary  = Bare kernel and shell, no drivers.  Recovery only.
advantage= Boots when a driver or profile is broken.
drawback = No XMS, no CD, no mouse, no sound.
games    = (none - repair use)
notes    = Tools: SAFEBOOT, CFGEDIT, HWINFO, MEM /C.

[PROMPT]
menu     = 8
config   = PROMPT
name     = Command Prompt Only
conv_kb  = 615
himem    = yes
ems      = no
umb      = no
mouse    = no
summary  = The CLEAN base with no Castalia menu - the banner, then a bare
           DOS prompt.  For power users and scripting.
advantage= Nothing resident beyond the shell; scriptable from the start.
drawback = No mouse, no CD, no upper memory; you load what you need.
games    = (whatever you start by hand)
notes    = Type CASTALIA for the menu, or LAUNCH for the game launcher.
