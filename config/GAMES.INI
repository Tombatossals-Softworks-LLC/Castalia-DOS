; =====================================================================
;  GAMES.INI  -  CASTALIA DOS game database
;  Installed to C:\CASTALIA\CFG\GAMES.INI  (read by LAUNCH.EXE)
;
;  One [SECTION] per game.  The section name is a short id.  A section is
;  treated as a game only if it has an "exe" key.  Keys:
;
;    name         Display name.
;    path         Full directory of the game (with drive letter).
;    exe          Executable to run (no path).
;    args         Optional command-line arguments.
;    profile      Recommended boot profile: CLEAN | XMS | EMS | CDROM.
;    sound        Sound profile hint: NONE | SPKR | ADLIB | SB | SBPRO | SB16.
;    mouse        yes/no  - does the game use a mouse.
;    requires_cd  yes/no  - does the game need the CD-ROM profile.
;    notes        Free text shown in the launcher detail pane.
;
;  The launcher warns if the recommended profile differs from the booted
;  profile, and refuses to launch if the exe is missing.  Edit freely.
; =====================================================================

[POP]
name        = Prince of Persia
path        = C:\GAMES\PRINCE
exe         = PRINCE.EXE
profile     = CLEAN
sound       = ADLIB
mouse       = no
requires_cd = no
notes       = Runs on any 386.  Use CLEAN if it stutters or hangs.

